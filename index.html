<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ▼ サイト名・説明はここを編集 -->
<title>サイト名</title>
<meta name="description" content="サイトの説明">
<style>
:root{--paper:#f6efe0;--card:#fffdf6;--ink:#3a2f25;--mute:#8a7a63;--line:#e3d8c2;--accent:#7a4b2a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);line-height:1.8;
  font-family:"Yu Mincho","Hiragino Mincho ProN","BIZ UDMincho",serif}
a{color:var(--accent)}
header{text-align:center;padding:56px 16px 18px}
h1{font-size:2rem;letter-spacing:.16em;margin:0 0 8px}
.lead{color:var(--mute);font-family:system-ui,sans-serif;max-width:600px;margin:0 auto}
main{max-width:860px;margin:0 auto;padding:10px 16px 70px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 3px 14px rgba(90,70,40,.12);padding:22px 26px;margin:22px 0;
  text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--accent)}
.card h2{margin:0 0 6px;font-size:1.3rem;letter-spacing:.08em}
.card p{margin:0;color:var(--mute);font-family:system-ui,sans-serif;font-size:.9rem}
footer{text-align:center;color:var(--mute);font-size:.78rem;font-family:system-ui,sans-serif;padding:20px}
</style>
</head>
<body>
<header>
  <!-- ▼ 見出しと紹介文 
  <h1>サイト名</h1>
  <p class="lead">ここにサイトの紹介文を書きます。</p>
  -->
</header>
<main>
  
  <a href="games/">retro advanture</a>

    <!-- ▼ コンテンツへのリンク。games/ 以下は publish.py が自動生成します -->

    <h2>&#128214; レトロアドベンチャー冒険記</h2>
    <p>Local LLM がプレイした Apple II アドベンチャーの冒険地図と冒険絵本</p>
  </a>
  -->
  <!-- 他のセクションを追加する場合はこのカードをコピー -->
</main>
<footer>
  <!-- ▼ フッター
  &copy; サイト名
  -->
</footer>
</body>
</html>
